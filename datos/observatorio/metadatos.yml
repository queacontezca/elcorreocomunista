# Metadatos de la capa de datos del Observatorio — El Correo Comunista
# Regla: toda cifra del observatorio.html sale de estos CSV (fuente única de verdad).
# Convención de números en CSV: punto decimal, sin separador de miles (formato máquina).
# En la página se muestran con punto de miles y coma decimal (formato es-CL).
ultima_descarga: "2026-10-11"
corte_anterior: "2026-08-16"
estatus_leyenda:
  O: "operativa — variable fresca con fuente oficial declarada"
  P: "proxy — mide por aproximación declarada, no el concepto mismo"
  C: "calibración — base envejecida recalculada (nivel de fondo, no variación)"
  X: "placeholder — sin variable operativa aún (no titula módulos)"

series:
  rentas_primarias_chile.csv:
    descripcion: "Rentas primarias de la balanza de pagos de Chile (débito, crédito, balance y componentes), millones US$ corrientes, suma anual de trimestres"
    fuente: "CEPALSTAT (CEPAL), indicador 547 «Balanza de pagos trimestral», que compila las cifras del Banco Central de Chile"
    url: "https://api-cepalstat.cepal.org/cepalstat/api/v1/indicator/547/records?lang=es"
    frecuencia: "trimestral (agregada a anual; 2026 parcial: T1 + T2, descarga 11-10-2026)"
    estatus: "O"
    notas: "Débitos en magnitud positiva (salida de recursos). «ied_utilidades_dividendos» = utilidades y dividendos de la inversión extranjera directa pagados al exterior (correa financiera). 2020: el crédito cae a 486 por la pandemia. Corte 11-10-2026: la fuente revisó 2026 T1 (débito 8.071 → 8.386; utilidades IED 7.021 → 7.231); los años 2016-2025 se recalcularon desde la descarga nueva y coinciden con lo publicado."

  rentas_primarias_chile_trimestral.csv:
    descripcion: "Rentas primarias de Chile por trimestre, 2023 T1 → 2026 T2 (débito, utilidades y dividendos IED, intereses de otra inversión, crédito, balance), millones US$ corrientes"
    fuente: "CEPALSTAT (CEPAL), indicador 547 «Balanza de pagos trimestral» (compila Banco Central de Chile)"
    url: "https://api-cepalstat.cepal.org/cepalstat/api/v1/indicator/547/records?lang=es"
    frecuencia: "trimestral"
    estatus: "O"
    notas: "Débitos en magnitud positiva; balance con su signo. 2026 T2 (US$ 8.807 M) es el trimestre de mayor débito de toda la serie disponible en el cubo para Chile (1993-2026), verificado sobre la descarga completa del 11-10-2026."

  rentas_primarias_al20.csv:
    descripcion: "Rentas primarias de América Latina (20 países), millones US$, suma simple de países"
    fuente: "elaboración propia sobre CEPALSTAT ind. 547 (suma de países con registros)"
    url: "https://api-cepalstat.cepal.org/cepalstat/api/v1/indicator/547/records?lang=es"
    frecuencia: "anual (suma de trimestres)"
    estatus: "O"
    notas: "SIN ACTUALIZAR en el corte 11-10-2026: solo 6 de los países del cubo reportan 2026 T2 (Bolivia, Brasil, Chile, Colombia, México y Perú), por lo que no se agrega un año parcial regional. «ied_utilidades_piso» es un PISO — Perú registra 0 en esa línea del cubo (no desagrega) y Venezuela/Cuba/Haití no reportan. El «debito_total» sí incluye a Perú."

  rentas_debito_pais_2024.csv:
    descripcion: "Renta (débito) total por país latinoamericano, 2024, millones US$"
    fuente: "elaboración propia sobre CEPALSTAT ind. 547"
    url: "https://api-cepalstat.cepal.org/cepalstat/api/v1/indicator/547/records?lang=es"
    frecuencia: "anual"
    estatus: "O"
    notas: "Venezuela, Cuba y Haití sin registros en el cubo (se reportan como 0 con nota, no como ausencia de flujo real)."

  drenaje_mundial_hickel.csv:
    descripcion: "Cifras verificadas del drenaje Sur→Norte por intercambio desigual (abstracts cotejados vía OpenAlex el 16-08-2026)"
    fuente: "Hickel, Sullivan y Zoomkawala (2021), New Political Economy 26(6) · Hickel, Dorninger, Wieland y Suwandi (2022), Global Environmental Change 73"
    url: "https://doi.org/10.1080/13563467.2021.1899153 y https://doi.org/10.1016/j.gloenvcha.2022.102467"
    frecuencia: "literatura (series 1960-2018 y 1990-2015)"
    estatus: "O"
    notas: "¡ATENCIÓN! El «US$ 10,8 billones (2015)» es del artículo de 2022 (GEC), NO del de 2021 (NPE: US$ 2,2 billones en 2018 y US$ 62 billones acumulados 1960-2018). Citar cada cifra con su artículo. La serie año a año no se grafica: vive en los anexos de los artículos (pendiente declarado)."

  ied_entradas_cepal.csv:
    descripcion: "Entradas de IED en AL y Chile, y razón utilidades pagadas / IED entrante"
    fuente: "CEPAL, La Inversión Extranjera Directa en América Latina y el Caribe 2025 (LC/PUB.2025/7-P/Rev.1, nov-2025, pp. 33 y 65) + CEPALSTAT"
    url: "https://www.cepal.org/es/publicaciones/82116-la-inversion-extranjera-directa-america-latina-caribe-2025"
    frecuencia: "anual"
    estatus: "O"
    notas: "Chile 2024: por cada US$ 1 de IED que entró salieron US$ 1,51 en utilidades. AL 2024: utilidades pagadas (piso) US$ 197.783 M > IED entrante US$ 188.962 M."

  impuesto_primera_categoria.csv:
    descripcion: "Tasa legal del impuesto de primera categoría (renta empresas), serie de hitos legales"
    fuente: "Ley 18.985 (1990), Ley 20.469 (2010), Ley 20.780 (2014); Ley de Reconstrucción Nacional y Desarrollo Económico y Social (Boletín 18216-05), promulgada el 09-10-2026 — calendario según prensa (Emol 09-10-2026; CNN Chile)"
    url: "https://www.senado.cl/appsenado/templates/tramitacion/index.php?boletin_ini=18216-05"
    frecuencia: "hitos legales"
    estatus: "O"
    notas: "Corte 11-10-2026: la megarreforma ya es ley promulgada (09-10-2026): 25,5 % en 2027, 24 % en 2028, 23 % en 2029; invariabilidad por contrato de 10 años (desde US$ 50 M), 15 (desde US$ 100 M) o 20 (desde US$ 350 M). PENDIENTE: falta la publicación en el Diario Oficial — al publicarse, reemplazar la cita de prensa por el número de ley y el texto oficial. El corte de agosto registraba «2030, 23 %, proyecto»."

  jornada_semana_obrera.csv:
    descripcion: "Composición de la semana obrera y tasas (s/v-jornada, TETV, labor share)"
    fuente: "Reporte de Análisis de Coyuntura N°1 (jul-2026), anexo técnico, sobre metodología Fundación SOL (2022, Tiempo Robado); insumo 2026.2; ENUT-INE"
    url: "https://fundacionsol.cl"
    frecuencia: "calibración (base 2022)"
    estatus: "C"
    notas: "Nivel de fondo, NO variación mensual. La TETV no se suma a s/v (el traslado no produce valor). Labor share oficial = cota superior; depurado 28-30 %."

  desempleo_integral_sol.csv:
    descripcion: "Tasa de desempleo (TD) y Tasa de Desempleo Integral (TDI: incorpora subempleo y desaliento), trimestre móvil"
    fuente: "Fundación SOL, Informe Mensual de Calidad del Empleo (Serie IMCE), sobre la Encuesta Nacional de Empleo del INE"
    url: "https://fundacionsol.cl"
    frecuencia: "mensual (trimestre móvil)"
    ultima_descarga: "2026-10-11"
    notas: "Se registra solo lo leído directamente en el PDF de la fuente. MJJ 2026 leído en el Resumen IMCE del 28-08-2026, p. 2. Al 11-10-2026 no se encontró el informe de junio-agosto."
    estatus: "O"
  kpi_corte.csv:
    descripcion: "Indicadores del corte con fecha y fuente (grilla KPI). Formato máquina desde sep-2026: valor_numerico + decimales (+ valor2_numerico/decimales2 para indicadores con dos cifras) + plantilla de despliegue (tokens {v}/{v2}), en vez de una columna de texto ya formateado."
    fuente: "Reporte N°1 (jul-2026) con diccionario de datos (SP, Comisión Ingresa, TGR, INE, Cochilco, SIPRI); corte 11-10-2026: SP (comunicado 03-09-2026), INE (nota de prensa 30-09-2026) y Cochilco (informe semanal 5-9 oct-2026) consultados directamente"
    url: "https://www.spensiones.cl · https://www.ine.gob.cl · https://www.cochilco.cl"
    frecuencia: "mensual/trimestral según indicador"
    estatus: "O (la fila «Digital/IA — capex hyperscalers» es X: sin fuente propia verificada, no se grafica)"
    notas: "Corte 11-10-2026: se actualizaron AFP, desempleo/informalidad y cobre; CAE, TGR y gasto militar no tienen dato nuevo y conservan su fecha. Los valores del corte anterior quedan en kpi_historial.csv. El stock AFP mide tamaño, no captura; su variación mensual es mayoritariamente revaluación de mercado. El capex de hyperscalers (~US$ 725.000 M, 2026) circulaba antes en el sitio sin ficha del dato ni fuente trazable en esta carpeta: queda declarado como pendiente (X) hasta que la editorial confirme la fuente exacta que usó — entonces se completa esta fila con valor_numerico, unidad y fuente reales."

  ingresos_tributarios_chile.csv:
    descripcion: "Ingresos tributarios del Gobierno Central de Chile, en % del PIB: total, impuesto a corporaciones y empresas, a personas físicas e impuestos generales sobre bienes y servicios (IVA)"
    fuente: "CEPALSTAT, indicador 821 «Ingresos tributarios por tipo de impuestos en porcentajes del PIB» (source_id 5283)"
    url: "https://api-cepalstat.cepal.org/cepalstat/api/v1/indicator/821/data?lang=es"
    frecuencia: "anual (serie 2012-2022 en el CSV; la API trae desde 1990)"
    ultima_descarga: "2026-10-19"
    estatus: "O"
    notas: "Cobertura: Gobierno Central, sin contribuciones sociales. Último año disponible: 2022. Se usa en la síntesis para comparar, en un mismo año, lo que el Estado retiene, lo que reparte como gasto social y lo que sale como rentas: son series de fuentes distintas sobre el mismo PIB, no un balance contable."

  gasto_social_chile.csv:
    descripcion: "Gasto público social del Gobierno Central de Chile, en % del PIB, por función (total, salud, educación, vivienda, protección social)"
    fuente: "CEPALSTAT, indicador 3127 «Gasto público social según clasificación por funciones del gobierno» (compila DIPRES)"
    url: "https://api-cepalstat.cepal.org/cepalstat/api/v1/indicator/3127/records?lang=es"
    frecuencia: "anual (serie 2012-2023)"
    estatus: "O"
    notas: "Cobertura: Gobierno Central. 2020-2021 reflejan el gasto de pandemia (peak 24,9 %). Último año disponible: 2023."

  renta_ied_chile_pais_2024.csv:
    descripcion: "Renta de la inversión extranjera directa pagada por Chile al exterior, por país/destino (principio direccional), y recibida del exterior, 2024, millones US$"
    fuente: "Banco Central de Chile, «Inversión extranjera directa por país, sector y región» (hoja Renta Direccional)"
    url: "https://si3.bcentral.cl/estadisticas/Principal1/excel/SE/BDP/Excel/Anual/IED_pais_sector_region.xlsx"
    frecuencia: "anual"
    estatus: "O"
    notas: "Utilidades distribuidas (el total con utilidades reinvertidas es el de la balanza de pagos, CEPALSTAT: 18.948 pagado / 7.959 recibido en 2024). «No asignados» = 4.247. Por sector: minería 8.379 (43 %), servicios financieros 2.671, electricidad-gas-agua 2.399."

  pib_y_mineria_chile.csv:
    descripcion: "PIB de Chile en dólares corrientes y participación de la explotación de minas y canteras (% del PIB)"
    fuente: "CEPALSTAT, indicador 2215 «PIB anual por actividad económica a precios corrientes en dólares» (compila Banco Central)"
    url: "https://api-cepalstat.cepal.org/cepalstat/api/v1/indicator/2215/records?lang=es"
    frecuencia: "anual"
    estatus: "O"
    notas: "La participación minera oscila 10,3-14,1 % en 2021-2025 según el precio del cobre."

  ajuste_fiscal_2026.csv:
    descripcion: "Programa de ajuste fiscal del gobierno de Kast (ministro Quiroz): montos y programas en revisión"
    fuente: "prensa (2+ medios por cifra): BioBioChile, Ex-ante, El Desconcierto, La Tercera; corte 11-10-2026: Emol, CNN Chile, Meganoticias"
    url: "https://www.biobiochile.cl"
    frecuencia: "coyuntura 2026"
    estatus: "O"
    notas: "US$ 6.000 M total prometido; US$ 3.800 M el primer año; PGU, gratuidad y bonos en revisión (recortes hasta 15 %). Corte 11-10-2026: se agregan el crecimiento del gasto del proyecto de Presupuesto 2027 (1,5 %) y la fecha de promulgación de la megarreforma — ambos con fuente de prensa, a reemplazar por DIPRES y Diario Oficial."

  mapa_base_paises.svg:
    descripcion: "Geometría de 179 países (paths SVG, proyección equirectangular 980×500) con clasificación céntrico/periférico"
    fuente: "Natural Earth (geometría) · clasificación: economías avanzadas según FMI"
    url: "https://www.imf.org/external/pubs/ft/weo/"
    frecuencia: "estática"
    estatus: "P"
    notas: "La dicotomía FMI es una PROXY de la teoría de la dependencia — se declara en la propia página."

  acciones_de_protesta_coes.csv:
    descripcion: "Número de acciones de protesta en Chile por año del hecho (2005-2024) y tema de la primera demanda registrada"
    fuente: "Reproducible Research, Centre for Social Conflict and Cohesion Studies COES, «Observatory of Conflicts - Cumulative Dataset», Harvard Dataverse, https://doi.org/10.7910/DVN/GKQXBR (archivo Base_Observatorio_conflictos_2005-2024_v1.xlsx, versión del 21-08-2025) y su Manual de Usuario (2020)"
    url: "https://doi.org/10.7910/DVN/GKQXBR"
    frecuencia: "anual"
    ultima_descarga: "2026-10-11"
    estatus: "P"
    notas: "Solo se publican totales: las condiciones de uso prohíben transferir la base a terceros. Año = variable P5c (fecha de la acción, no de codificación). Tema = agrupación propia del primer elemento de demanda (P19a1): 01xx educación; 03xx laboral, salvo 0306 pensiones; 06xx salud; 12xx vivienda; 02xx pueblos originarios; 04xx y 08xx ambiental y territorial; 05xx y 09xx feminista y diversidad; 11xx derechos humanos y memoria; 13xx sistema político; el resto, otras. «Sin demanda registrada» = P19a1 vacío (la mitad de las acciones de 2019). La base cuenta acciones recogidas por la prensa y la radio codificadas: el número depende de los medios cubiertos cada año. El manual limita el uso a docencia e investigación."
